# GitHub, generated from the iTerm2-Color-Schemes palette:
# https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/schemes/GitHub.itermcolors
#
# Faithful transcription of the upstream scheme. Note that upstream leans on
# several near-white values (regular3, regular7, bright2, bright6, bright7)
# that have almost no contrast against the f4f4f4 background: pale yellow and
# white text will read as invisible. Darken those if it bites.

[colors]
background=f4f4f4
foreground=3e3e3e

regular0=3e3e3e
regular1=970b16
regular2=07962a
regular3=f8eec7
regular4=003e8a
regular5=e94691
regular6=89d1ec
regular7=ffffff

bright0=666666
bright1=de0000
bright2=87d5a2
bright3=f1d007
bright4=2e6cba
bright5=ffa29f
bright6=1cfafe
bright7=ffffff

selection-foreground=535353
selection-background=a9c1e2

# cursor = <text under cursor> <cursor block>
cursor=f4f4f4 3f3f3f
