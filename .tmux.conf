set -g base-index 1

set -g mouse on

# GitHub theme
# ============
# Chrome colors taken from the GitHub iTerm2 scheme:
# https://github.com/mbadolato/iTerm2-Color-Schemes/blob/master/schemes/GitHub.itermcolors
#
#   ink    #3e3e3e  Ansi 0 / Foreground
#   paper  #f4f4f4  Background
#   navy   #003e8a  Ansi 4
#   blue   #2e6cba  Ansi 12
#   red    #de0000  Ansi 9
#   yellow #f1d007  Ansi 11
#   wash   #a9c1e2  Selection
#   slate  #535353  Selected Text
#
# The scheme only defines a 16-color terminal palette, so the status bar needs
# two neutrals it does not supply: #f4f4f4 doubles as primary text (9.7:1 on
# ink), and #c8c8c8 (6.4:1) carries secondary labels. The active window is
# marked by its blue block rather than by dimming everything else, which keeps
# inactive window numbers bright enough to scan from across a large screen.

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#3e3e3e,fg=#f4f4f4"

# Session name badge in navy.
set -g status-left "#[bg=#003e8a,fg=#ffffff,bold] #S #[default] "
set -g status-left-length 30

# Active window is a solid blue block. Inactive window numbers are bold white
# so they read as the selectable targets they are; names trail behind softer.
set -g window-status-separator ""
set -g window-status-format "#[fg=#f4f4f4,bold] #I #[nobold,fg=#c8c8c8]#W #[default]"
set -g window-status-current-format "#[bg=#2e6cba,fg=#ffffff,bold] #I #W #[default]"
set -g window-status-activity-style "fg=#f1d007"
set -g window-status-bell-style "fg=#de0000,bold"

set -g status-right "#[fg=#c8c8c8]#h #[fg=#f4f4f4]%H:%M "
set -g status-right-length 40

set -g pane-border-style "fg=#9b9b9b"
set -g pane-active-border-style "fg=#2e6cba"

set -g message-style "bg=#2e6cba,fg=#ffffff,bold"
set -g message-command-style "bg=#003e8a,fg=#ffffff"

# Copy-mode selection reuses the scheme's own selection colors.
set -g mode-style "bg=#a9c1e2,fg=#535353"
setw -g clock-mode-colour "#2e6cba"
